name: Build & Release Desktop Installers (Windows, Linux, macOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  prepare:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether to build & publish release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_RAW="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Triggered by tag push: ${TAG}"
            exit 0
          fi

          TAG="v${VERSION_RAW}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -f -a "${TAG}" -m "Release ${TAG}"
              git push origin "${TAG}"
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch for ${TAG}"
            exit 0
          fi

          ASSET_COUNT="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
          if [[ "${ASSET_COUNT}" -ge 3 ]]; then
            echo "Release ${TAG} already published (${ASSET_COUNT} assets); skipping installer rebuild."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "New version ${TAG} on main -> building & publishing desktop installers!"

  build-windows:
    name: Windows x64 (.exe + .msi)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure LLVM libclang for Windows bindgen
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Bundle static FFmpeg & FFprobe for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          $zipPath = "$env:TEMP\ffmpeg-win64.zip"
          $extractDir = "$env:TEMP\ffmpeg-extracted"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $ffmpegExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "src-tauri/resources/ffmpeg.exe" -Force
          Copy-Item $ffprobeExe.FullName -Destination "src-tauri/resources/ffprobe.exe" -Force
          Get-ChildItem "src-tauri/resources"

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: bun install

      - name: Build Windows NSIS (.exe) & WiX (.msi) Installers
        shell: pwsh
        run: bun apps/web/node_modules/@tauri-apps/cli/tauri.js build --bundles nsis,msi

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CelestiaVid-Windows-x64-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish Windows Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: CelestiaVid ${{ needs.prepare.outputs.tag }}
          make_latest: "true"
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    name: Linux x64 (.deb + .AppImage)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    env:
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GTK, WebKit2GTK & Clang Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            libfuse2 \
            clang \
            libclang-dev \
            cmake \
            pkg-config \
            wget \
            curl \
            xz-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Bundle static FFmpeg & FFprobe for Linux
        run: |
          mkdir -p src-tauri/resources
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o /tmp/ffmpeg-linux.tar.xz
          mkdir -p /tmp/ffmpeg-linux
          tar -xf /tmp/ffmpeg-linux.tar.xz -C /tmp/ffmpeg-linux
          cp "$(find /tmp/ffmpeg-linux -type f -name ffmpeg | head -n 1)" src-tauri/resources/ffmpeg
          cp "$(find /tmp/ffmpeg-linux -type f -name ffprobe | head -n 1)" src-tauri/resources/ffprobe
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/ffprobe

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: bun install

      - name: Build Linux (.deb & .AppImage) Installers
        run: bun apps/web/node_modules/@tauri-apps/cli/tauri.js build --bundles deb,appimage

      - name: Upload Linux Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CelestiaVid-Linux-x64-Installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Publish Linux Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: CelestiaVid ${{ needs.prepare.outputs.tag }}
          make_latest: "true"
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    name: macOS Apple Silicon (.dmg)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    env:
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: bun install

      - name: Build macOS (.dmg) Installer
        run: bun apps/web/node_modules/@tauri-apps/cli/tauri.js build --bundles dmg

      - name: Upload macOS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CelestiaVid-macOS-arm64-Installer
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Publish macOS Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: CelestiaVid ${{ needs.prepare.outputs.tag }}
          make_latest: "true"
          files: src-tauri/target/release/bundle/dmg/*.dmg
