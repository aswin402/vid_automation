[package]
name = "celestiavid-desktop"
version = "0.2.1"
description = "CelestiaVid Native Desktop App (Tauri v2 + Pure Rust Media Pipeline)"
authors = ["CelestiaLabs"]
license = "MIT"
edition = "2021"

[lib]
name = "celestiavid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
celestiavid-core = { path = "../crates/celestiavid-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
